services:
  # ---------- Backend (Node/Express API) ----------
  - type: web
    name: shikkha-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: shikkha-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- Frontend (React static site) ----------
  - type: web
    name: shikkha-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && REACT_APP_API_URL="$API_HOST/api" npm run build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: shikkha-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
